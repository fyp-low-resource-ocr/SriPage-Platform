name: sripage-platform

services:

  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sripage}"
      POSTGRES_USER: "${POSTGRES_USER:-sripage}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - app


  redis:
    image: "${REDIS_IMAGE:-redis:7-alpine}"
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - "${REDIS_PASSWORD}"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - app


  minio:
    image: "${MINIO_IMAGE:?set MINIO_IMAGE}"
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}"

    volumes:
      - minio_data:/data

    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

    networks:
      - app


  backend:
    image: "ghcr.io/fyp-low-resource-ocr/sripage-backend:${APP_VERSION:?set APP_VERSION}"
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"

    environment:
      NODE_ENV: production

      DATABASE_URL: "postgres://${POSTGRES_USER:-sripage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sripage}"

      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000

      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-localhost}"
      MINIO_PUBLIC_PORT: "${MINIO_PUBLIC_PORT:-9000}"

      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"

      CORS_ORIGIN: "${CORS_ORIGIN}"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_started

    stop_grace_period: 30s

    networks:
      - app


  frontend:
    image: "ghcr.io/fyp-low-resource-ocr/sripage-frontend:${APP_VERSION:?set APP_VERSION}"
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:3000"

    depends_on:
      backend:
        condition: service_started

    stop_grace_period: 20s

    networks:
      - app


volumes:
  postgres_data:
  redis_data:
  minio_data:


networks:
  app:
    driver: bridge
